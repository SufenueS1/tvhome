<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home</title>
<style>html, body { margin: 0; height: 100%; background: #05060a; color: #f4f6fb; font: 3.2vh sans-serif; }</style>
</head>
<body>
<script>
// Bootstrap. TizenBrew serves this file through jsDelivr's @main alias, which can lag
// a push by hours, so it pulls the real page pinned to the latest commit instead.
(function () {
  var BASE = 'https://cdn.jsdelivr.net/gh/SufenueS1/tvhome@';
  var SVC = location.port === '8081' ? 'http://127.0.0.1:8095' : null;

  function page(ref) {
    return fetch(BASE + ref + '/app/home.html').then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    });
  }
  function latest() {
    if (!SVC) return Promise.resolve('main');
    return fetch(SVC + '/version').then(function (r) { return r.json(); })
      .then(function (j) { return j.sha || 'main'; })
      .catch(function () { return 'main'; });
  }
  function fail() {
    document.body.innerHTML = '<p style="margin:10vh 8vw">Home couldn’t load. Check the internet connection, then press the red button to retry.</p>';
    document.addEventListener('keydown', function (e) { if (e.keyCode === 403 || e.keyCode === 13) location.reload(); });
  }

  latest()
    .then(function (ref) { return page(ref).catch(function () { return page('main'); }); })
    .then(function (html) { document.open(); document.write(html); document.close(); })
    .catch(fail);
})();
</script>
</body>
</html>
